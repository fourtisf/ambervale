name: ambervale

services:
  postgres:
    image: postgres:16
    container_name: ambervale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ambervale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambervale}
      POSTGRES_DB: ${POSTGRES_DB:-ambervale}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ambervale-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ambervale} -d ${POSTGRES_DB:-ambervale}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    container_name: ambervale-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ambervale-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  ambervale-pgdata:
  ambervale-redisdata:
