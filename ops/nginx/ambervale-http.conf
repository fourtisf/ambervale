# AMBERVALE — nginx directives that belong to http{}, not to one site.
#
# Install to /etc/nginx/conf.d/ambervale-http.conf (ops/nginx/install.sh does).
#
# Why this is a separate file: upstreams, real-IP settings, maps and gzip are
# http-context directives. Kept inside the site file they still *work* — the
# site file is included from http{} — but they apply to every other vhost on
# the box, and they collide with the distribution's own nginx.conf. Two real
# failures came from exactly that:
#
#   [emerg] duplicate upstream "ambervale_api"  — a second copy of the site
#   [emerg] "gzip" directive is duplicate       — Debian's nginx.conf sets it
#
# So: this file owns everything shared, the site file owns only its servers.

upstream ambervale_api {
    server 127.0.0.1:4021;
    keepalive 32;
}

upstream ambervale_web {
    server 127.0.0.1:4022;
    keepalive 32;
}

# Cloudflare hands us the visitor's address here; without this every request
# would appear to come from Cloudflare and the rate limiter would be useless.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# `gzip on` and `gzip_vary on` are deliberately absent: Debian and Ubuntu set
# both in /etc/nginx/nginx.conf, and repeating either fails the config test.
# If this box's nginx.conf does not enable gzip, add `gzip on;` there rather
# than here. What follows only tunes a compression that is already switched on.
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    text/css
    text/plain;

# Required by the `Connection $connection_upgrade` line above.
#
# It was commented out with a note to "put this in http{} context", which this
# file already is — sites-enabled/* is included from inside http{} — so the
# effect of the note was that `nginx -t` failed on the documented install with
# `unknown "connection_upgrade" variable`. It lives here, uncommented.
#
# If another site on this box already defines the same map, nginx will refuse
# to start with "duplicate map"; in that case delete this block rather than
# the other one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
