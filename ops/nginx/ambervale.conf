# AMBERVALE — the site itself: two server blocks, nothing shared.
#
# Install to /etc/nginx/sites-available/ambervale and symlink into
# sites-enabled — ops/nginx/install.sh does both, and checks for the clashes
# that have bitten this box twice.
#
# The upstreams (ambervale_api, ambervale_web) and the $connection_upgrade map
# used below are defined in ops/nginx/ambervale-http.conf, which belongs in
# conf.d. Without that file installed, nginx will refuse to start here with
# "unknown upstream" — they are a pair.
#
# server_name and the certificate paths below are EXAMPLES. Edit them for the
# real domain before installing, or keep your existing file and copy in only
# the parts you need.

server {
    listen 80;
    server_name ambervale.example.com api.ambervale.example.com;
    return 301 https://$host$request_uri;
}

# --- API ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.ambervale.example.com;

    ssl_certificate     /etc/letsencrypt/live/ambervale.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambervale.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The API sets a session cookie; nothing here may be cached.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # Metrics and the claim export are basic-auth'd in the app, but there is no
    # reason for them to be reachable from the internet at all.
    #
    # The proxy_pass has to be repeated here: a location block does not inherit
    # the one from `location /`, so without it an allowed request falls through
    # to the filesystem and 404s — which made these endpoints unreachable even
    # from the box itself.
    location ~ ^/(metrics|admin/) {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://ambervale_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ambervale_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --- Web ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ambervale.example.com;

    ssl_certificate     /etc/letsencrypt/live/ambervale.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambervale.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next.js fingerprints these filenames, so they are safe to cache forever.
    location /_next/static/ {
        proxy_pass http://ambervale_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # An add_header in a location replaces the server-level set outright,
        # so the security headers have to be repeated or they are simply gone
        # for every asset the page loads.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://ambervale_web;
        proxy_http_version 1.1;

        # HTML is never cached, anywhere.
        #
        # The page names its stylesheet and script by content hash, so a cached
        # copy of yesterday's HTML asks for chunks that no longer exist on the
        # origin — they 404, and the site renders as unstyled text. That is not
        # hypothetical: it is what ambervale.fun looked like after a deploy.
        #
        # proxy_hide_header first, because add_header appends rather than
        # replaces, and two Cache-Control headers leave the edge to choose.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;

        # Upgrade headers are set so Next's dev HMR and any future websocket
        # work through the same vhost without a config change.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
