# AMBERVALE — Nginx front end.
#
# Sits behind Cloudflare (orange-cloud). Cloudflare terminates TLS at the edge;
# this terminates it again at the origin, so the hop is never plaintext.
#
# Install: /etc/nginx/sites-available/ambervale.conf, symlink into
# sites-enabled, `nginx -t`, then `systemctl reload nginx`.

upstream ambervale_api {
    server 127.0.0.1:4021;
    keepalive 32;
}

upstream ambervale_web {
    server 127.0.0.1:4022;
    keepalive 32;
}

# Cloudflare hands us the visitor's address here; without this every request
# would appear to come from Cloudflare and the rate limiter would be useless.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    text/css
    text/plain;

server {
    listen 80;
    server_name ambervale.example.com api.ambervale.example.com;
    return 301 https://$host$request_uri;
}

# --- API ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.ambervale.example.com;

    ssl_certificate     /etc/letsencrypt/live/ambervale.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambervale.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The API sets a session cookie; nothing here may be cached.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # Metrics and the claim export are basic-auth'd in the app, but there is no
    # reason for them to be reachable from the internet at all.
    #
    # The proxy_pass has to be repeated here: a location block does not inherit
    # the one from `location /`, so without it an allowed request falls through
    # to the filesystem and 404s — which made these endpoints unreachable even
    # from the box itself.
    location ~ ^/(metrics|admin/) {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://ambervale_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ambervale_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --- Web ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ambervale.example.com;

    ssl_certificate     /etc/letsencrypt/live/ambervale.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ambervale.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next.js fingerprints these filenames, so they are safe to cache forever.
    location /_next/static/ {
        proxy_pass http://ambervale_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # An add_header in a location replaces the server-level set outright,
        # so the security headers have to be repeated or they are simply gone
        # for every asset the page loads.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://ambervale_web;
        proxy_http_version 1.1;

        # HTML is never cached, anywhere.
        #
        # The page names its stylesheet and script by content hash, so a cached
        # copy of yesterday's HTML asks for chunks that no longer exist on the
        # origin — they 404, and the site renders as unstyled text. That is not
        # hypothetical: it is what ambervale.fun looked like after a deploy.
        #
        # proxy_hide_header first, because add_header appends rather than
        # replaces, and two Cache-Control headers leave the edge to choose.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;

        # Upgrade headers are set so Next's dev HMR and any future websocket
        # work through the same vhost without a config change.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# Required by the `Connection $connection_upgrade` line above.
#
# It was commented out with a note to "put this in http{} context", which this
# file already is — sites-enabled/* is included from inside http{} — so the
# effect of the note was that `nginx -t` failed on the documented install with
# `unknown "connection_upgrade" variable`. It lives here, uncommented.
#
# If another site on this box already defines the same map, nginx will refuse
# to start with "duplicate map"; in that case delete this block rather than
# the other one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
