# Redis persistence for AMBERVALE.
#
# Redis holds sessions, rate-limit windows and action locks. Losing it logs
# everyone out — recoverable, since the browser keeps its deviceId — but it
# also drops the in-flight action locks, so persistence is worth having.
#
# AOF with everysec: at most one second of writes lost on a hard kill, which
# for a rate-limit window is immaterial.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshots as a second line of defence.
save 900 1
save 300 10
save 60 10000

# Sessions have their own TTL; this is a backstop against unbounded growth.
maxmemory 512mb
maxmemory-policy volatile-lru

# Never expose this beyond the box.
bind 127.0.0.1 ::1
protected-mode yes
