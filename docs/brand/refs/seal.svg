<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="AMBERVALE — The Seal">
  <title>AMBERVALE — The Seal</title>
  <!-- Sun over furrows, ringed with seed. Fully abstract — no character, no scene — which is the direction that ages the slowest. -->
  <defs>
    <linearGradient id="rim" x1="0.12" y1="0.02" x2="0.88" y2="0.98">
      <stop offset="0" stop-color="#ffe9ae"/><stop offset="0.18" stop-color="#f7cd6a"/>
      <stop offset="0.42" stop-color="#e0a637"/><stop offset="0.62" stop-color="#a9711b"/>
      <stop offset="0.82" stop-color="#d8a13a"/><stop offset="1" stop-color="#f6d385"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe4a0"/><stop offset="0.5" stop-color="#f4b942"/>
      <stop offset="1" stop-color="#c07f1c"/>
    </linearGradient>
    <radialGradient id="enamel" cx="0.40" cy="0.30" r="0.92">
      <stop offset="0" stop-color="#1c5b73"/><stop offset="0.42" stop-color="#0f3f55"/>
      <stop offset="1" stop-color="#05202c"/>
    </radialGradient>
    <radialGradient id="recess" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.70" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#000" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="tight"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="field"><circle cx="200" cy="200" r="166"/></clipPath>
</defs>
  
  <rect width="400" height="400" fill="#061c26"/>
  <ellipse cx="200" cy="214" rx="186" ry="184" fill="#000" opacity="0.5" filter="url(#soft)"/>
  <circle cx="200" cy="200" r="184" fill="url(#rim)"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#5b3a0c" stroke-width="3" opacity="0.55"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#fff3cf" stroke-width="2.5" opacity="0.5"/>
  <path d="M 64 122 A 152 152 0 0 1 196 46" fill="none" stroke="#fff8e4" stroke-width="7"
        stroke-linecap="round" opacity="0.55" filter="url(#tight)"/>
  <path d="M 330 262 A 152 152 0 0 1 232 350" fill="none" stroke="#fff2d0" stroke-width="5"
        stroke-linecap="round" opacity="0.22" filter="url(#tight)"/>
  <circle cx="200" cy="200" r="166" fill="url(#enamel)"/>

  <g clip-path="url(#field)">
    
    <circle cx="200" cy="200" r="150" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.55"/>
    <circle cx="338.0" cy="200.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="333.3" cy="235.7" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="319.5" cy="269.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="297.6" cy="297.6" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="269.0" cy="319.5" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="235.7" cy="333.3" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="200.0" cy="338.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="164.3" cy="333.3" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="131.0" cy="319.5" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="102.4" cy="297.6" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="80.5" cy="269.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="66.7" cy="235.7" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="62.0" cy="200.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="66.7" cy="164.3" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="80.5" cy="131.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="102.4" cy="102.4" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="131.0" cy="80.5" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="164.3" cy="66.7" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="200.0" cy="62.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="235.7" cy="66.7" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="269.0" cy="80.5" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="297.6" cy="102.4" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="319.5" cy="131.0" r="4.6" fill="url(#gold)" opacity="0.9"/><circle cx="333.3" cy="164.3" r="4.6" fill="url(#gold)" opacity="0.9"/>
    <circle cx="200" cy="168" r="46" fill="url(#gold)"/>
    <circle cx="200" cy="168" r="46" fill="none" stroke="#8a5a10" stroke-width="3" opacity="0.4"/>
    <g stroke="url(#gold)" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M 118 240 q 82 -24 164 0"/>
      <path d="M 126 268 q 74 -22 148 0"/>
      <path d="M 138 296 q 62 -20 124 0"/>
    </g>

    
    <circle cx="200" cy="200" r="166" fill="url(#recess)"/>
    <ellipse cx="132" cy="112" rx="150" ry="104" transform="rotate(-24 132 112)"
             fill="#ffffff" opacity="0.085" filter="url(#soft)"/>
    <rect width="400" height="400" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>

  </g>
</svg>
