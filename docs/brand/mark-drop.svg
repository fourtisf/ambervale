<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ambervale drop mark">
  <title>AMBERVALE — drop mark</title>
  <defs>
    <linearGradient id="dresin" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffdc94"/><stop offset="0.45" stop-color="#f4b942"/><stop offset="1" stop-color="#c98a20"/>
    </linearGradient>
    <!-- Fills the square far more than the lockup's drop does: an icon that
         leaves a third of its box empty just renders smaller than its
         neighbours in a row of tabs. -->
    <clipPath id="dclip">
      <path d="M 128 10 C 164 62, 218 116, 218 162 a 90 90 0 0 1 -180 0 C 38 116, 92 62, 128 10 Z"/>
    </clipPath>
  </defs>
  <path d="M 128 10 C 164 62, 218 116, 218 162 a 90 90 0 0 1 -180 0 C 38 116, 92 62, 128 10 Z" fill="url(#dresin)"/>
  <g clip-path="url(#dclip)">
    <!-- One ridge and one windmill. Anything more is mush at 20px. -->
    <path d="M 20 188 C 66 164, 118 176, 158 190 C 196 203, 222 196, 246 186 L 246 270 L 20 270 Z" fill="#1a5a72"/>
    <g transform="translate(158 142)">
      <path d="M -12 52 L -6.5 2 L 6.5 2 L 12 52 Z" fill="#0a2e3d"/>
      <path d="M 0 -5 L -10 4 L 10 4 Z" fill="#0a2e3d"/>
      <g fill="#0a2e3d" transform="translate(0 -3) rotate(18)">
        <path id="dblade" d="M 0 0 L 5 -4 L 38 -8 L 38 4 L 5 4 Z"/>
        <use href="#dblade" transform="rotate(90)"/>
        <use href="#dblade" transform="rotate(180)"/>
        <use href="#dblade" transform="rotate(270)"/>
        <circle r="5.2" fill="#f4b942"/>
      </g>
    </g>
    <path d="M 110 44 C 84 88, 60 122, 56 162 C 54 186, 64 204, 78 216 C 60 200, 44 180, 46 152 C 49 112, 78 74, 110 44 Z" fill="#fff" opacity="0.28"/>
  </g>
  <path d="M 128 10 C 164 62, 218 116, 218 162 a 90 90 0 0 1 -180 0 C 38 116, 92 62, 128 10 Z" fill="none" stroke="#0a2e3d" stroke-width="9"/>
</svg>
